name: MarkdownCore tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Benchmark (release)
        run: swift test -c release -Xswiftc -enable-testing --filter Performance
